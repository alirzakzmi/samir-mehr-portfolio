<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>افزودن دسته‌بندی | پنل مدیریت</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-layout">

    <aside id="adminSidebar" class="admin-sidebar">
        <div class="sidebar-head">
            <img src="../assets/images/logo.png" alt="لوگو" />
            <div><p class="sidebar-name">سمیر مهر رامان</p><p class="sidebar-sub">پنل مدیریت</p></div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="side-link">داشبورد</a>
            <a href="categories.html" class="side-link active">دسته‌بندی‌ها</a>
            <a href="products.html" class="side-link">محصولات</a>
        </nav>
        <div class="sidebar-foot"><a href="login.html" class="side-link">خروج</a></div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="admin-col">

        <header class="admin-header">
            <div class="admin-header-inner start">
                <button id="sidebarToggleBtn" class="sidebar-toggle" aria-label="منو">
                    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1>افزودن دسته‌بندی</h1>
            </div>
        </header>

        <main class="admin-main">
            <form action="categories.html" class="admin-card admin-form">
                <div class="form-body">
                    <div>
                        <label class="field-label" for="slugName">نام دسته‌بندی *</label>
                        <input type="text" id="slugName" class="admin-field" required placeholder="مثلاً: سرمایشی" />
                    </div>
                    <div>
                        <label class="field-label" for="slugTarget">Slug</label>
                        <input type="text" id="slugTarget" class="admin-field" dir="ltr" placeholder="cooling" />
                    </div>
                    <div>
                        <label class="field-label" for="catDesc">توضیحات</label>
                        <textarea id="catDesc" rows="3" class="admin-field"></textarea>
                    </div>
                </div>
                <div class="form-foot">
                    <a href="categories.html" class="btn-cancel">انصراف</a>
                    <button type="submit" class="btn-save">ذخیره</button>
                </div>
            </form>
        </main>
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>
