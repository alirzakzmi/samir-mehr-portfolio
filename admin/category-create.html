<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>افزودن دسته‌بندی | پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Vazirmatn', 'system-ui', 'sans-serif'] },
            colors: { lab: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' } }
        } } }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-700 font-sans antialiased overflow-x-hidden">

<div class="min-h-screen flex">
    <aside id="adminSidebar" class="fixed lg:static inset-y-0 right-0 z-40 w-72 bg-lab-900 text-lab-100 flex flex-col transform transition-transform duration-300 translate-x-full lg:translate-x-0">
        <div class="h-20 px-6 flex items-center gap-3 border-b border-white/10">
            <img src="../assets/images/logo.png" class="w-11 h-11 object-contain bg-white rounded-xl p-1.5" />
            <div><p class="font-extrabold text-white text-sm">سمیر مهر رامان</p><p class="text-[11px] text-lab-300">پنل مدیریت</p></div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 text-sm">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-lab-200">داشبورد</a>
            <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold bg-lab-600 text-white">دسته‌بندی‌ها</a>
            <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-lab-200">محصولات</a>
        </nav>
        <div class="p-3 border-t border-white/10"><a href="login.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-lab-200">خروج</a></div>
    </aside>
    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden"></div>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-20 bg-white border-b border-slate-200 h-20">
            <div class="h-full px-4 sm:px-6 flex items-center gap-3">
                <button id="sidebarToggleBtn" class="lg:hidden p-2.5 rounded-xl border border-slate-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-base font-extrabold text-slate-800">افزودن دسته‌بندی</h1>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <form action="categories.html" class="max-w-2xl bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">نام دسته‌بندی *</label>
                        <input type="text" id="slugName" required placeholder="مثلاً: سرمایشی" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">Slug</label>
                        <input type="text" id="slugTarget" dir="ltr" placeholder="cooling" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">توضیحات</label>
                        <textarea rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm resize-none"></textarea>
                    </div>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                    <a href="categories.html" class="px-4 py-2.5 text-xs font-bold text-slate-600">انصراف</a>
                    <button type="submit" class="bg-lab-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl">ذخیره</button>
                </div>
            </form>
        </main>
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>
