<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود به پنل مدیریت | سمیر مهر رامان</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-body" data-base="../">

<div class="login-page">

    <div class="login-blob-1"></div>
    <div class="login-blob-2"></div>

    <div class="login-wrap">
        <div class="login-card">

            <div class="login-head">
                <div class="login-logo">
                    <img src="../assets/images/logo.png" alt="لوگو" />
                </div>
                <h1>ورود به پنل مدیریت</h1>
                <p>شرکت سمیر مهر رامان</p>
            </div>

            <form id="loginForm" action="dashboard.html" class="form-stack" novalidate>

                <div>
                    <label class="field-label" for="loginEmail">ایمیل</label>
                    <div class="input-wrap">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" id="loginEmail" class="login-input" required dir="ltr" autocomplete="off" placeholder="admin@example.com" />
                    </div>
                    <p id="emailError" class="field-error hidden">ایمیل وارد شده معتبر نیست.</p>
                </div>

                <div>
                    <label class="field-label" for="passwordInput">رمز عبور</label>
                    <div class="input-wrap">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="passwordInput" class="login-input has-toggle" required placeholder="••••••••" dir="ltr" autocomplete="new-password" />

                        <button type="button" id="togglePassword" class="toggle-pass" aria-label="نمایش رمز">
                            <svg id="eyeIconClosed" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eyeIconOpen" class="hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                    <p id="passwordError" class="field-error hidden">رمز عبور باید حداقل ۸ کاراکتر باشد.</p>
                </div>

                <div class="forgot">
                    <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
                </div>

                <label class="remember">
                    <input type="checkbox" value="1" />
                    <span>مرا به خاطر بسپار</span>
                </label>

                <button type="submit" id="loginSubmitBtn" class="login-submit" disabled>
                    ورود به پنل
                    <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg>
                </button>
            </form>

            <div class="back-link-wrap">
                <a href="../index.html" class="back-link">
                    <svg class="icon-xs" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    بازگشت به سایت
                </a>
            </div>
        </div>

        <p class="login-copy">© ۱۴۰۴ شرکت سمیر مهر رامان</p>
    </div>
</div>

<script src="../assets/js/main.js"></script>
</body>
</html>
