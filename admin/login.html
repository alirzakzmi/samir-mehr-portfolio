<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود به پنل مدیریت | سمیر مهر رامان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Vazirmatn', 'system-ui', 'sans-serif'] },
            colors: { lab: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' } },
            boxShadow: { soft: '0 10px 40px -15px rgba(8,145,178,.25)', glow: '0 0 40px -10px rgba(34,211,238,.5)' }
        } } }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-lab-50 text-slate-700 font-sans antialiased">

<script>window.BASE_PATH = '../';</script>

<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-lab-200/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
    <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-lab-100/60 rounded-full blur-3xl translate-y-1/2 -translate-x-1/3"></div>
    <div class="absolute inset-0 pattern-grid opacity-40"></div>

    <div class="relative w-full max-w-md">
        <div class="bg-white rounded-3xl border border-lab-100 shadow-soft p-8 sm:p-10">

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-lab-500 to-lab-700 mb-4 shadow-glow">
                    <img src="../assets/images/logo.png" alt="لوگو" class="w-full h-full object-contain p-2.5" />
                </div>
                <h1 class="text-xl font-extrabold text-lab-900">ورود به پنل مدیریت</h1>
                <p class="text-sm text-slate-500 mt-1.5">شرکت سمیر مهر رامان</p>
            </div>

            <form id="loginForm" action="dashboard.html" class="space-y-5" novalidate>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">ایمیل</label>
                    <div class="relative">
                        <svg class="w-5 h-5 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" id="loginEmail" required dir="ltr" autocomplete="off" placeholder="admin@example.com"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pr-11 pl-4 py-3 text-sm font-medium focus:outline-none transition" />
                    </div>
                    <p id="emailError" class="hidden text-[11px] text-rose-600 font-semibold mt-1.5">ایمیل وارد شده معتبر نیست.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">رمز عبور</label>
                    <div class="relative">
                        <svg class="w-5 h-5 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="passwordInput" required placeholder="••••••••" dir="ltr" autocomplete="new-password"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pr-11 pl-11 py-3 text-sm font-medium focus:outline-none transition" />

                        <button type="button" id="togglePassword" aria-label="نمایش رمز"
                            class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-lab-600 transition z-10">
                            <svg id="eyeIconClosed" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eyeIconOpen" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                    <p id="passwordError" class="hidden text-[11px] text-rose-600 font-semibold mt-1.5">رمز عبور باید حداقل ۸ کاراکتر باشد.</p>
                </div>

                <div class="text-left -mt-2">
                    <a href="#" class="text-[11px] font-semibold text-lab-600">رمز عبور را فراموش کرده‌اید؟</a>
                </div>

                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" value="1" class="w-4 h-4 rounded border-slate-300 text-lab-600 focus:ring-lab-500/30" />
                    <span class="text-xs font-semibold text-slate-600">مرا به خاطر بسپار</span>
                </label>

                <button type="submit" id="loginSubmitBtn"
                    class="w-full flex items-center justify-center gap-2 bg-slate-300 cursor-not-allowed opacity-60 text-white font-bold text-sm px-6 py-3.5 rounded-xl transition shadow-soft">
                    ورود به پنل
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg>
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="../index.html" class="text-xs font-semibold text-slate-500 inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15 19l-7-7 7-7"/></svg>
                    بازگشت به سایت
                </a>
            </div>
        </div>

        <p class="text-center text-[11px] text-slate-400 mt-6">© ۱۴۰۴ شرکت سمیر مهر رامان</p>
    </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        window.location.href = 'dashboard.html';
    });
</script>
</body>
</html>
