<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محصولات | پنل مدیریت</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-layout">

    <aside id="adminSidebar" class="admin-sidebar">
        <div class="sidebar-head">
            <img src="../assets/images/logo.png" alt="لوگو" />
            <div><p class="sidebar-name">سمیر مهر رامان</p><p class="sidebar-sub">پنل مدیریت</p></div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="side-link">داشبورد</a>
            <a href="categories.html" class="side-link">دسته‌بندی‌ها</a>
            <a href="products.html" class="side-link active">محصولات</a>
            <a href="../index.html" target="_blank" class="side-link">مشاهده سایت</a>
        </nav>
        <div class="sidebar-foot"><a href="login.html" class="side-link">خروج</a></div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="admin-col">

        <header class="admin-header">
            <div class="admin-header-inner start">
                <button id="sidebarToggleBtn" class="sidebar-toggle" aria-label="منو">
                    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1>محصولات</h1>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-card clip">
                <div class="card-head">
                    <h2>لیست محصولات</h2>
                    <a href="product-create.html" class="list-head-btn">+ افزودن</a>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>نام</th>
                            <th>دسته</th>
                            <th>وضعیت</th>
                            <th class="end">عملیات</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="cell-name">دستگاه اتوکلاو</td>
                            <td><span class="pill pill-solid">آزمایشگاهی</span></td>
                            <td><span class="pill pill-published">منتشر شده</span></td>
                            <td class="end"><a href="product-create.html" class="edit-link">ویرایش</a></td>
                        </tr>
                        <tr>
                            <td class="cell-name">یخچال دارویی</td>
                            <td><span class="pill pill-solid">سرمایشی</span></td>
                            <td><span class="pill pill-published">منتشر شده</span></td>
                            <td class="end"><a href="product-create.html" class="edit-link">ویرایش</a></td>
                        </tr>
                        <tr class="draft-row">
                            <td class="cell-name">محیط کشت</td>
                            <td><span class="pill pill-muted">سایر</span></td>
                            <td><span class="pill pill-draft">پیش‌نویس</span></td>
                            <td class="end"><a href="product-create.html" class="edit-link">ویرایش</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>
